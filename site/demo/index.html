<!doctype html>
<html lang="kk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DenSau</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap">
<style>
/* Layout: one phone-width column with a fixed three-tab bar. Teal and coral on warm paper, from the team's mockup. */
:root{
  --paper:#F5F2EA; --card:#FFFFFF; --ink:#1B231F; --muted:#5A6A63;
  --line:rgba(27,35,31,.10); --line-strong:rgba(27,35,31,.28); --chip:#EDEAE0;
  --teal:#0E6E5C; --teal-deep:#0A5346; --teal-ink:#0E6E5C; --teal-tint:#D8ECE4; --on-teal:#FFFFFF;
  --coral:#C84B22; --coral-tint:#FBE2D8; --on-coral:#FFFFFF;
  --shadow:0 14px 30px -18px rgba(14,110,92,.45);
  --font-display:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1512; --card:#16221D; --ink:#EAF1EC; --muted:#9DB0A6;
    --line:rgba(234,241,236,.12); --line-strong:rgba(234,241,236,.34); --chip:#22302A;
    --teal:#1F8A74; --teal-deep:#146B5A; --teal-ink:#63D3B8; --teal-tint:#173A31; --on-teal:#FFFFFF;
    --coral:#F0825C; --coral-tint:#3A2018; --on-coral:#1B120E;
    --shadow:0 14px 30px -18px rgba(0,0,0,.8); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1512; --card:#16221D; --ink:#EAF1EC; --muted:#9DB0A6;
  --line:rgba(234,241,236,.12); --line-strong:rgba(234,241,236,.34); --chip:#22302A;
  --teal:#1F8A74; --teal-deep:#146B5A; --teal-ink:#63D3B8; --teal-tint:#173A31; --on-teal:#FFFFFF;
  --coral:#F0825C; --coral-tint:#3A2018; --on-coral:#1B120E;
  --shadow:0 14px 30px -18px rgba(0,0,0,.8); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.45;
  padding-block:18px 128px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal-ink);outline-offset:2px}
.ic{flex-shrink:0}
.app{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.brand b{color:var(--teal-ink)}
.mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(155deg,var(--teal),var(--teal-deep));display:grid;place-items:center;color:#fff;font-size:17px}
.today-label{font-size:13px;color:var(--muted);font-weight:600;text-align:right}

.greet small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.greet h1{margin:2px 0 0;font-family:var(--font-display);font-size:26px;line-height:1.15;letter-spacing:-.015em;text-wrap:balance}

/* progress */
.progress{background:linear-gradient(155deg,var(--teal),var(--teal-deep));border-radius:22px;padding:18px 20px;color:#fff;box-shadow:var(--shadow)}
.progress .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}
.progress .t{font-weight:600;font-size:14px;opacity:.92}
.progress .n{font-family:var(--font-display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.25);overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:8px;transition:width .4s ease}
.progress p{margin:12px 0 0;font-size:13px;opacity:.9}

/* sections */
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
.sec-h h2{margin:0;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}

/* week strip */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.day small{font-size:11.5px;color:var(--muted);font-weight:600}
.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.dot.full{background:var(--teal);color:var(--on-teal)}
.dot.part{background:var(--teal-tint);color:var(--teal-ink);box-shadow:inset 0 0 0 2px var(--teal)}
.dot.miss{background:var(--coral-tint);color:var(--coral);box-shadow:inset 0 0 0 2px var(--coral)}
.dot.wait{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--teal)}
.dot.none{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line-strong)}
.day.now small{color:var(--ink)}
.day.now .dot{outline:2px solid var(--ink);outline-offset:2px}
.cnt{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}

/* doses */
.list{display:flex;flex-direction:column;gap:10px}
.dose{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.dose.late{border-color:var(--coral)}
.pill-ic{width:42px;height:42px;border-radius:12px;background:var(--teal-tint);color:var(--teal-ink);display:grid;place-items:center}
.dose.due .pill-ic,.dose.late .pill-ic{background:var(--coral-tint);color:var(--coral)}
.dose-main{flex:1;min-width:0}
.dose-name{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.dose-meta{font-size:12.5px;color:var(--muted);margin-top:1px;overflow-wrap:anywhere}
.dose-meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.check{width:32px;height:32px;border-radius:50%;border:2px solid var(--line-strong);background:transparent;display:grid;place-items:center;color:transparent;padding:0;flex-shrink:0}
.check.on{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;font-size:14px;background:var(--teal);color:var(--on-teal);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.coral{background:var(--coral);color:var(--on-coral)}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.block{width:100%;padding:14px;font-size:15px;border-radius:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:4px 0;font-size:13px;font-weight:600;color:var(--teal-ink);text-decoration:underline;text-underline-offset:3px}

.empty{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:28px 18px}
.empty h3{margin:0;font-family:var(--font-display);font-size:18px}
.empty p{margin:0;color:var(--muted);font-size:14px}

.note{font-size:12.5px;color:var(--muted);line-height:1.5}
.note.pad{padding:0 4px}
.chipnote{display:inline-flex;align-items:center;gap:8px;background:var(--chip);border-radius:100px;padding:6px 8px 6px 12px;font-size:12px;font-weight:600;color:var(--muted);align-self:flex-start}
.chipnote button{background:var(--card);border:1px solid var(--line);border-radius:100px;padding:3px 10px;font-size:12px;font-weight:600}

/* add view */
.h-title{margin:0;font-family:var(--font-display);font-size:24px;letter-spacing:-.015em}
.h-sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.scan{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;border:2px dashed var(--teal);background:var(--teal-tint);border-radius:22px;padding:30px 18px;cursor:pointer}
.scan:focus-within{outline:3px solid var(--teal-ink);outline-offset:2px}
.scan input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.scan .big{width:54px;height:54px;border-radius:16px;background:var(--teal);color:var(--on-teal);display:grid;place-items:center;margin-bottom:6px}
.scan b{font-size:16px}
.scan span{font-size:13px;color:var(--muted)}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.05em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.reading{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.reading img,.preview{width:100%;max-height:220px;object-fit:cover;border-radius:16px;border:1px solid var(--line)}
.scanline{position:relative;width:100%}
.scanline::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--teal);box-shadow:0 0 18px 4px var(--teal);border-radius:3px;animation:sweep 1.8s ease-in-out infinite alternate}
@keyframes sweep{from{top:6%}to{top:92%}}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid var(--teal-tint);border-top-color:var(--teal);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--coral-tint);color:var(--ink);border-radius:16px;padding:12px 14px;font-size:13.5px}
.alert .ic{color:var(--coral);margin-top:2px}
.alert.info{background:var(--teal-tint)}
.alert.info .ic{color:var(--teal-ink)}
.med-edit{display:flex;flex-direction:column;gap:12px}
.med-edit .head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.badge{font-size:12px;font-weight:700;border-radius:100px;padding:4px 10px}
.badge.ok{background:var(--teal-tint);color:var(--teal-ink)}
.badge.warn{background:var(--coral-tint);color:var(--coral)}
.badge.man{background:var(--chip);color:var(--muted)}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label,.lbl{font-size:12px;font-weight:700;color:var(--muted)}
.inp{width:100%;background:var(--paper);border:1px solid var(--line-strong);border-radius:12px;padding:11px 13px;font-size:15px}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:10px}
.times{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tchip{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--teal);color:var(--on-teal);border-radius:100px;padding:7px 8px 7px 14px;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
.tchip .ic{opacity:.85}
.tadd{display:flex;gap:6px;align-items:center}
.tadd .inp{width:112px;padding:8px 10px;font-size:14px}
.sm{padding:8px 12px;font-size:13px}
.inc{display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px}
.inc input{width:20px;height:20px;accent-color:var(--teal)}
.confirm{display:flex;gap:12px;align-items:flex-start;font-size:14px;font-weight:600;line-height:1.4;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.confirm input{width:22px;height:22px;margin-top:1px;accent-color:var(--teal);flex-shrink:0}

/* relative view */
.who{display:flex;align-items:center;gap:14px}
.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(155deg,#F2B79A,#E8623A);display:grid;place-items:center;color:#fff;font-family:var(--font-display);font-weight:700;font-size:18px;flex-shrink:0}
.who b{display:block;font-size:17px;font-family:var(--font-display)}
.who span{font-size:13px;color:var(--muted)}
.status{display:flex;flex-direction:column;gap:6px;border-radius:20px;padding:16px 18px}
.status.ok{background:var(--teal-tint);color:var(--ink)}
.status.warn{background:var(--coral-tint)}
.status b{font-family:var(--font-display);font-size:18px;line-height:1.25}
.status span{font-size:13.5px;color:var(--muted)}
.tag{font-size:12px;font-weight:700;border-radius:100px;padding:5px 11px;white-space:nowrap}
.tag.ok{background:var(--teal);color:var(--on-teal)}
.tag.wait{background:var(--chip);color:var(--muted)}
.tag.late{background:var(--coral);color:var(--on-coral)}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  padding-top:8px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabbar .in{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{background:none;border:0;border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tab[aria-current="page"]{color:var(--teal-ink);background:var(--teal-tint)}
.tab.add .ic{background:var(--teal);color:var(--on-teal);border-radius:10px;padding:5px;width:30px;height:30px}
.tab.add[aria-current="page"] .ic{background:var(--teal-deep)}

/* oraza + journal */
.oraza{display:flex;flex-direction:column;gap:12px}
.oraza .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.oraza .row>div{min-width:0}
.oraza h3{margin:0;font-family:var(--font-display);font-size:16px}
.oraza p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.oraza.on{border-color:var(--teal);background:var(--teal-tint)}
.t2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.t3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:11px;padding:10px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .l1{fill:none;stroke:var(--teal-ink);stroke-width:2.5;stroke-linejoin:round}
.chart .l2{fill:none;stroke:var(--coral);stroke-width:2.5;stroke-dasharray:6 4;stroke-linejoin:round}
.chart .m1{fill:var(--teal-ink)}
.chart .m2{fill:var(--coral)}
.key{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin-bottom:8px}
.key span{display:inline-flex;align-items:center;gap:6px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.stat{background:var(--paper);border-radius:14px;padding:10px 12px}
.stat small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.stat b{font-family:var(--font-display);font-size:17px;font-variant-numeric:tabular-nums}
.entry{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.entry .m{flex:1;min-width:0}
.entry .v{font-family:var(--font-display);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.entry small{display:block;color:var(--muted);font-size:12.5px}
.x{border:0;background:var(--chip);color:var(--muted);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;padding:0;flex-shrink:0}
/* menu drawer */
.top .right{display:flex;align-items:center;gap:10px}
.menubtn{border:0;background:var(--chip);color:var(--ink);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;padding:0;flex-shrink:0}
.scrim{position:fixed;inset:0;z-index:60;background:rgba(10,20,16,.55);display:flex;justify-content:flex-end}
.sheet{width:min(360px,92vw);height:100%;background:var(--paper);overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));animation:slidein .25s ease}
@keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sh h2{margin:0;font-family:var(--font-display);font-size:20px}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.menu-item .t{flex:1;min-width:0}
.menu-item b{display:block;font-size:15px}
.menu-item small{display:block;color:var(--muted);font-size:12.5px}
.about li{margin-bottom:8px}
.about{margin:0;padding-left:18px;font-size:14px}
.wknav{display:flex;gap:8px}
.wknav .x{font-size:20px;line-height:1;padding-bottom:2px}
.x[disabled]{opacity:.35;cursor:not-allowed}
body.onb .tabbar{display:none}
body.onb{padding-bottom:32px}
.ob{display:flex;flex-direction:column;gap:16px}
.ob h1{margin:0;font-family:var(--font-display);font-size:26px;line-height:1.15;letter-spacing:-.015em;text-wrap:balance}
.docrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.docrow .m{flex:1;min-width:0}
.docrow b{display:block;font-size:14.5px}
.docrow small{color:var(--muted);font-size:12.5px}
.confirm.dis{opacity:.55}
.doc h2{margin:12px 0 6px;font-family:var(--font-display);font-size:22px}
.doc h3{margin:16px 0 4px;font-size:14.5px}
.doc p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}
.msgbox{width:100%;min-height:210px;resize:vertical;line-height:1.5}
.askrow{display:flex;gap:8px;flex-wrap:wrap}
.askrow .btn{flex:1}
a.btn{text-decoration:none}
.wel{min-height:calc(100vh - 70px);min-height:calc(100dvh - 70px);display:flex;flex-direction:column;justify-content:center;gap:28px;text-align:center}
.wel .mark{width:76px;height:76px;font-size:36px;border-radius:24px;margin:0 auto 14px}
.wel h1{margin:0;font-family:var(--font-display);font-size:38px;letter-spacing:-.02em}
.wel h1 b{color:var(--teal-ink)}
.wel-btns{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--chip)}
.steps i.on{background:var(--teal)}
.cm-scrim{position:fixed;inset:0;z-index:70;background:rgba(10,20,16,.58);display:flex;align-items:center;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.cm{background:var(--card);border-radius:22px;width:min(100%,540px);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.cm-bar{height:4px;background:var(--chip);flex-shrink:0}
.cm-bar i{display:block;height:100%;width:0;background:var(--teal);transition:width .15s}
.cm-body{overflow-y:auto;padding:16px 20px;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.cm-foot{padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;flex-shrink:0}
.cm-foot .note{text-align:center}
.cm-acts{display:flex;gap:10px}
.cm-acts .btn{flex:1}
.doc a{color:var(--teal-ink);word-break:break-all}
.mini{margin:0 0 4px;font-size:14px;font-family:var(--font-display)}
.prof{padding:4px 2px 8px}
.who span{display:block;color:var(--muted);font-size:13px}
.relcard{display:flex;align-items:center;gap:12px;padding:12px 14px}
.relcard .t{flex:1;min-width:0}.relcard b{display:block;font-size:14.5px}.relcard small{color:var(--muted);font-size:12.5px}
.avatar.sm{width:38px;height:38px;font-size:16px}
.faq b{display:block}
.bd{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.5fr) minmax(0,1fr);gap:8px}

тся только ИИ-сервису, DenSau его не хранит.","Кесте мен журнал деректері тек сіздің құрылғыңыздағы браузерде сақталады.":"Данные расписания и журнала хранятся только в браузере на вашем устройстве.","Қысым мен қант мәндерін DenSau бағаламайды, шешімді дәрігер қабылдайды.":"DenSau не оценивает значения давления и сахара, решение принимает врач.","График үшін кемінде 2 өлшем жазыңыз.":"Для графика запишите не менее 2 измерений.","Жоғарғы (систолалық)":"Верхнее (систолическое)","Төменгі (диастолалық)":"Нижнее (диастолическое)","Қант, ммоль/л":"Сахар, ммоль/л","Қан қысымы":"Артериальное давление","Қант деңгейі":"Уровень сахара"," графигі, соңғы ":" — график, последние "," өлшем\">":" измерений\">","Соңғысы":"Последнее","Орташа":"Среднее","Өлшем саны":"Кол-во измерений","Денсаулық журналы":"Журнал здоровья","Өлшемдерді жазыңыз, график дәрігерге көрсетуге ыңғайлы.":"Записывайте измерения, график удобно показать врачу.","\">Қан қысымы":"\">Давление","\">Қант":"\">Сахар","Жоғарғы":"Верхнее","Төменгі":"Нижнее","Пульс":"Пульс","Қашан":"Когда","Тамақтан кейін":"После еды","Басқа уақытта":"В другое время"," Жазу":" Записать","Соңғы жазбалар":"Последние записи"," · пульс ":" · пульс "," ммоль/л":" ммоль/л","\" aria-label=\"Жазбаны өшіру\">":"\" aria-label=\"Удалить запись\">","DenSau мәндерді бағаламайды және диагноз қоймайды. Қысым мен қант туралы шешімді дәрігер қабылдайды.":"DenSau не оценивает значения и не ставит диагноз. Решение о давлении и сахаре принимает врач.","DenSau командасы (студенттік жоба)":"Команда DenSau (студенческий проект)","Демо нұсқа (құжат нұсқасы 0.1). Мәтін нақты қолданысқа шығар алдында заңгер тексеруінен өтеді.":"Демо-версия (версия документа 0.1). Перед реальным использованием текст пройдёт проверку юристом.","1. Қосымша туралы":"1. О приложении","DenSau — дәрі қабылдау кестесін құруға және еске салуға көмектесетін оқу және пилоттық қосымша. Ол медициналық қызмет емес: диагноз қоймайды, ем тағайындамайды және дәрігер кеңесін алмастырмайды.":"DenSau — учебное и пилотное приложение, помогающее составить расписание приёма лекарств и напоминать о нём. Это не медицинская услуга: оно не ставит диагноз, не назначает лечение и не заменяет консультацию врача.","2. Жасанды интеллект":"2. Искусственный интеллект","ИИ рецепт, дәрі қорабы немесе выписка фотосынан дәрі атауын, дозасын және уақытын оқиды. ИИ қателесуі мүмкін. Сіз әрқашан нәтижені құжатпен салыстырып, түзетіп, растайсыз. Растамайынша, ештеңе кестеге қосылмайды.":"ИИ считывает с фото рецепта, упаковки или выписки название, дозу и время приёма лекарства. ИИ может ошибаться. Вы всегда сверяете результат с документом, исправляете и подтверждаете. Пока вы не подтвердите, ничего в расписание не добавляется.","3. Еске салу":"3. Напоминания","Еске салу қосымша ашық тұрғанда ғана көрсетіледі, оның уақытында келетініне кепілдік жоқ. Дәрі қабылдауға жауапкершілік өзіңізде.":"Напоминания показываются только при открытом приложении, гарантии, что они придут вовремя, нет. Ответственность за приём лекарств лежит на вас.","4. Шұғыл жағдай":"4. Экстренный случай","Жағдайыңыз нашарласа немесе шұғыл белгілер болса (кеуде ауруы, тыныс алу қиындығы, есінен тану), 112-ге қоңырау шалыңыз. Қосымша бұл үшін жасалмаған.":"Если состояние ухудшилось или появились тревожные признаки (боль в груди, затруднённое дыхание, обморок), звоните на 112. Приложение для этого не предназначено.","5. Дәрі туралы сұрақ":"5. Вопрос о лекарстве","Қосымша сұрағыңызды дәрігерге немесе фармацевке жіберуге арналған хабарға айналдырады. Дәрі ауыстыру немесе доза туралы шешімді тек дәрігер қабылдайды.":"Приложение превращает ваш вопрос в сообщение, которое можно отправить врачу или фармацевту. Решение о замене лекарства или о дозе принимает только врач.","6. Жас":"6. Возраст","Қосымшаны 18 жастан асқан адам немесе заңды өкілінің келісімімен қолдана алады.":"Приложением может пользоваться человек старше 18 лет или с согласия законного представителя.","7. Жауапкершілік":"7. Ответственность","Қосымша «қалай бар солай» ұсынылады және медициналық шешім қабылдауға негіз бола алмайды.":"Приложение предоставляется «как есть» и не может служить основанием для принятия медицинских решений.","Құпиялылық саясаты және деректерді өңдеуге келісім":"Политика конфиденциальности и согласие на обработку данных","1. Оператор":"1. Оператор","2. Субъект және деректер тізімі":"2. Субъект и перечень данных","Субъект — сіз (қосымша пайдаланушысы). Өңделетін деректер: атыңыз (міндетті емес); қамқор туысыңыздың аты, туыстық дәрежесі және телефоны (оның келісімімен); дәрі тізімі (атауы, дозасы, уақыты); қабылдау белгілері; қан қысымы мен қант өлшемдері; ораза режимінің уақыттары; келісім күні. Дәрі туралы хабарды ИИ-мен құрастырғанда осы деректердің қажетті бөлігі ИИ қызметіне жіберіледі (тек бөлек келісім берсеңіз).":"Субъект — вы (пользователь приложения). Обрабатываемые данные: ваше имя (необязательно); имя, степень родства и телефон родственника-опекуна (с его согласия); список лекарств (название, доза, время); отметки о приёме; измерения давления и сахара; время режима Ораза; дата согласия. При составлении сообщения о лекарстве с помощью ИИ нужная часть этих данных отправляется ИИ-сервису (только если вы дали отдельное согласие).","3. Мақсаты":"3. Цель","Тек сіздің дәрі кестеңізді жүргізу, еске салу, журнал графигін көрсету және дәрігерге хабар дайындау. Жарнамаға және басқа мақсатқа қолданылмайды.":"Только ведение вашего расписания лекарств, напоминания, показ графика журнала и подготовка сообщения врачу. Для рекламы и иных целей не используются.","4. Қайда сақталады":"4. Где хранится","Бұл нұсқада деректер тек сіздің құрылғыңыздағы браузерде сақталады. Тек фотодан тану қолданылғанда сурет ИИ қызметіне жіберіледі (сайт нұсқасында ол DenSau-дың шағын сервер функциясы арқылы өтеді, бірақ сақталмайды). Браузер деректерін тазаласаңыз, олар жоғалады.":"В этой версии данные хранятся только в браузере на вашем устройстве. Только при распознавании по фото изображение отправляется ИИ-сервису (в веб-версии оно проходит через небольшую серверную функцию DenSau, но не сохраняется). Если очистить данные браузера, они пропадут.","5. Фото және ИИ":"5. Фото и ИИ","Фото тану үшін сіз таңдаған сурет ИИ қызметіне (Google Gemini) жіберіледі. Ол Қазақстаннан тыс жерде өңделуі мүмкін (шетелге беру). Бұл тек сіз бөлек келісім бергенде орындалады. DenSau фотоны өзі сақтамайды, ал ИИ қызметінің өз ережелері қолданылады.":"Для распознавания выбранное вами изображение отправляется ИИ-сервису (Google Gemini). Оно может обрабатываться за пределами Казахстана (трансграничная передача). Это происходит только при вашем отдельном согласии. DenSau само фото не хранит, а применяются собственные правила ИИ-сервиса.","6. Үшінші тұлғаларға беру":"6. Передача третьим лицам","Басқа адамға (мысалы, туысқа) деректер тек сіздің рұқсатыңызбен көрсетіледі. Бұл нұсқада туыс көрінісі демо және бір құрылғыда ғана жұмыс істейді.":"Другому человеку (например, родственнику) данные показываются только с вашего разрешения. В этой версии вид для родственника является демо и работает только на одном устройстве.","7. Мерзімі":"7. Срок","Деректер келісімді қайтарып алғанша немесе өшіргенше құрылғыңызда сақталады.":"Данные хранятся на вашем устройстве, пока вы не отзовёте согласие или не удалите их.","8. Құқықтарыңыз":"8. Ваши права","Мәзірдегі «Келісімдер» бөлімінде келісімді қайтарып алуға және барлық деректі өшіруге болады. Деректі түзету үшін «Баптаулар» бөлімін қолданыңыз, басқа сұраққа «Техникалық қолдау» бөлімі арқылы жазыңыз.":"В разделе «Согласия» меню можно отозвать согласие и удалить все данные. Для исправления данных используйте раздел «Настройки», по другим вопросам пишите через «Техподдержку».","9. Құқықтық негіз":"9. Правовое основание","Осы келісім Қазақстан Республикасының 2013 жылғы 21 мамырдағы № 94-V «Дербес деректер және оларды қорғау туралы» Заңына (https://adilet.zan.kz/rus/docs/Z1300000094) сәйкес беріледі. Заңның 8-бабы бойынша келісімде оператор, субъект, өңдеу мерзімі, үшінші тұлғаға және шетелге беру, деректер тізімі көрсетілуі тиіс: олар осы құжаттың 1–7 тармақтарында келтірілген.":"Настоящее согласие даётся в соответствии с Законом Республики Казахстан от 21 мая 2013 года № 94-V «О персональных данных и их защите» (https://adilet.zan.kz/rus/docs/Z1300000094). По статье 8 Закона в согласии должны быть указаны оператор, субъект, срок обработки, передача третьим лицам и за границу, перечень данных: они приведены в пунктах 1–7 этого документа.","10. Келісімді қайтарып алу":"10. Отзыв согласия","Келісімді қосымшаның «Келісімдер» бөлімінен қайтарып алуға болады. Заң бойынша өңдеу 15 жұмыс күні ішінде тоқтатылады, ал осы құрылғыдағы дерек қайтарып алған сәтте өшіріледі.":"Согласие можно отозвать в разделе «Согласия» приложения. По закону обработка прекращается в течение 15 рабочих дней, а данные на этом устройстве удаляются в момент отзыва.","11. Серверлік нұсқа":"11. Серверная версия","Болашақта деректер серверге көшірілсе, олар Қазақстан аумағындағы базада сақталады және сізден қайта келісім сұралады.":"Если в будущем данные будут перенесены на сервер, они будут храниться в базе на территории Казахстана, и у вас будет запрошено повторное согласие.","Фотоны ИИ-мен танытуға келісім":"Согласие на распознавание фото с помощью ИИ","1. Не жіберіледі":"1. Что отправляется","Дәрі қосқанда сіз таңдаған фото (рецепт, дәрі қорабы, выписка немесе скриншот). «Дәрі туралы сұрақ» бөлімінде хабар жасау үшін сіз таңдаған дәрінің атауы, дозасы және қабылдау белгілері.":"Фото, выбранное вами при добавлении лекарства (рецепт, упаковка, выписка или скриншот). В разделе «Вопрос о лекарстве» для составления сообщения отправляются название и доза выбранного вами лекарства и отметки о приёме.","2. Кімге жіберіледі":"2. Кому отправляется","ИИ қызметіне: Google Gemini. Ол деректі Қазақстаннан тыс жерде өңдеуі мүмкін (шетелге беру).":"ИИ-сервису: Google Gemini. Он может обрабатывать данные за пределами Казахстана (трансграничная передача).","Тек фотодан дәрі мәліметін оқу және дәрігерге жіберілетін хабарды құрастыру. DenSau фотоны өзі сақтамайды, ал ИИ қызметінің өз ережелері қолданылады.":"Только чтение сведений о лекарстве с фото и подготовка сообщения, отправляемого врачу. DenSau само фото не хранит, а применяются собственные правила ИИ-сервиса.","4. Міндетті емес":"4. Необязательно","Келіспесеңіз де қосымшаны қолдана аласыз: дәріні қолмен қосасыз. Келісімді кез келген уақытта «Келісімдер» бөлімінде қайтарып алуға болады.":"Если вы не согласны, приложением всё равно можно пользоваться: лекарство добавляется вручную. Согласие можно в любой момент отозвать в разделе «Согласия».","берілмеген":"не предоставлено","Дәріңізді уақытында ішуге көмектесетін көмекші":"Помощник, который поможет вовремя принимать лекарства"," block\" data-act=\"ob-reg\">Тіркелу":" block\" data-act=\"ob-reg\">Регистрация"," block\" data-act=\"ob-login-page\">Кіру":" block\" data-act=\"ob-login-page\">Войти","Жаңа тіркелу осы құрылғыдағы ескі профильді және деректі өшіреді. ":"Новая регистрация удалит старый профиль и данные на этом устройстве. ","Демо нұсқада профиль тек осы құрылғыда сақталады.":"В демо-версии профиль хранится только на этом устройстве.","Астана":"Астана","Алматы":"Алматы","Шымкент":"Шымкент","Қарағанды":"Караганда","Ақтөбе":"Актобе","Тараз":"Тараз","Павлодар":"Павлодар","Өскемен":"Усть-Каменогорск","Семей":"Семей","Атырау":"Атырау","Қостанай":"Костанай","Қызылорда":"Кызылорда","Орал":"Уральск","Петропавл":"Петропавловск","Ақтау":"Актау","Түркістан":"Туркестан","Көкшетау":"Кокшетау","Талдықорған":"Талдыкорган","Қапшағай":"Капшагай","Басқа":"Другое","Атыңызды жазыңыз.":"Введите имя.","Телефон нөмірін толық жазыңыз (10 сан, мысалы 701 234 56 78).":"Введите телефон полностью (10 цифр, например 701 234 56 78).","Email дұрыс емес. Жоқ болса, бос қалдырыңыз.":"Email неверный. Если его нет, оставьте пустым.","Құпиясөз кемінде 6 таңба болуы керек.":"Пароль должен быть не менее 6 символов.","Құпиясөздер сәйкес емес.":"Пароли не совпадают.","Туған күнд function ic(n,s){s=s||20;return '<svg class="ic" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[n]+'</svg>';}
function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return String(n).padStart(2,'0');}
function dkey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function mins(t){var p=t.split(':');return (+p[0])*60+(+p[1]);}
function uid(){return Math.random().toString(36).slice(2,9);}

/* ---------- state ---------- */
function seed(){
  var today=new Date(), added=dkey(addDays(today,-28));
  var meds=[
    {id:'m1',name:tr('Метформин'),dose:tr('500 мг'),times:['08:00'],note:tr('таңертең'),added:added},
    {id:'m2',name:tr('Аспирин'),dose:tr('100 мг'),times:['13:00'],note:tr('түскі ас кезінде'),added:added},
    {id:'m3',name:tr('Витамин D'),dose:'',times:['20:00'],note:tr('кешке'),added:added}
  ];
  var log={},pat=[3,2,3,1,3,2,3],nowD=new Date();
  for(var i=1;i<=27;i++){
    var d=addDays(today,-i),k=dkey(d),take=pat[i%7];log[k]={};
    meds.forEach(function(m,mi){if(mi<take)m.times.forEach(function(t){log[k][m.id+'@'+t]={at:t};});});
  }
  log[dkey(today)]={};
  log[dkey(today)]['m1@08:00']={at:(nowD.getHours()*60+nowD.getMinutes()>=485?'08:05':pad(nowD.getHours())+':'+pad(nowD.getMinutes()))};
  var sys=[132,128,135,126,130,124,127],dia=[84,82,88,80,84,79,81],glu=[6.4,5.9,6.8,5.6,6.1,5.8,6.0],vitals=[];
  for(var j=0;j<7;j++){var vd=addDays(today,j-6);vd.setHours(8,30,0,0);var tt=vd.getTime();
    vitals.push({id:'vb'+j,t:tt,type:'bp',a:sys[j],b:dia[j],c:null});
    vitals.push({id:'vg'+j,t:tt+60000,type:'glu',a:glu[j],ctx:tr('Аш қарынға')});}
  return {demo:true,demoV2:true,name:tr('Айгерім'),meds:meds,log:log,vitals:vitals,oraza:{on:false,sahur:'04:30',iftar:'18:00'},consent:null};
}
var S;
function load(){try{var r=localStorage.getItem(STORE);if(r){var p=JSON.parse(r);if(p&&Array.isArray(p.meds)){p.vitals=p.vitals||[];p.consent=p.consent||null;p.oraza=p.oraza||{on:false,sahur:'04:30',iftar:'18:00'};
    if(p.demo&&!p.demoV2){p.demoV2=true;var td=new Date();p.meds.forEach(function(m){if(m.id==='m1'||m.id==='m2'||m.id==='m3')m.added=dkey(addDays(td,-28));});
      for(var i=1;i<=27;i++){var d=addDays(td,-i),k=dkey(d);p.log[k]=p.log[k]||{};p.meds.forEach(function(m){if(m.id.charAt(0)!=='m')return;m.times.forEach(function(t){var key=m.id+'@'+t;if(p.log[k][key])return;var h=(d.getDate()*7+m.id.charCodeAt(1)*3+i)%9;if(h!==0)p.log[k][key]={at:t};});});}}
    return p;}}}catch(e){}return seed();}

S=load();

/* ---------- pilot: anonymous stats ---------- */
var PILOT_DAYS=7,TRACK_URL='/.netlify/functions/track';
var PID=(function(){try{var v=localStorage.getItem('densau-pid');if(!v||!/^[a-z0-9]{6,16}$/.test(v)){v=Math.random().toString(36).slice(2,10);if(v.length<6)v+='abcdef';localStorage.setItem('densau-pid',v);}return v;}catch(e){return 'x'+Math.random().toString(36).slice(2,9);}})();
function pilotCode(){return PID.slice(0,6).toUpperCase();}
function dayDiff(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);}
function pilotDay(){if(!S.pilot)return 0;return Math.max(1,dayDiff(dkey(new Date(S.pilot.start)),dkey(new Date()))+1);}
function pilotStats(){
  var out={planned:0,taken:0,rel:0,pct:0};
  if(!S.pilot)return out;
  var st=dkey(new Date(S.pilot.start)),today=dkey(new Date()),n=Math.min(pilotDay(),60);
  for(var i=0;i<n;i++){
    var k=dkey(addDays(new Date(S.pilot.start),i));
    dosesFor(k).forEach(function(d){
      var e=(S.log[k]||{})[d.key];
      if(k===today&&!e&&mins(d.time)>nowMin())return;
      out.planned++;if(e){out.taken++;if(e.by==='rel')out.rel++;}
    });
  }
  out.pct=out.planned?Math.round(out.taken/out.planned*100):0;
  return out;
}
function track(evt,extra){
  try{
    var b={pid:PID,evt:evt,lang:(typeof LANG!=='undefined'?LANG:'kk'),mode:S.pilot?'pilot':(S.demo?'demo':'user')};
    if(S.pilot){var ps=pilotStats();b.start=S.pilot.start;b.day=pilotDay();b.planned=ps.planned;b.taken=ps.taken;b.rel=ps.rel;b.meds=S.meds.length;b.hasRel=!!(S.relative&&S.relative.name);}
    if(extra)for(var k in extra)b[k]=extra[k];
    fetch(TRACK_URL,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b),keepalive:true}).catch(function(){});
  }catch(e){}
}
var syncT=0;
function pilotSync(){famSync();if(!S.pilot)return;clearTimeout(syncT);syncT=setTimeout(function(){track('sync');},2500);}
try{if(!FAM&&!sessionStorage.getItem('densau-vis')){sessionStorage.setItem('densau-vis','1');setTimeout(function(){track('visit');},400);}}catch(e){}


function shiftTime(t){
  var o=S.oraza;if(!o||!o.on)return t;
  var m=mins(t);
  if(m>mins(o.sahur)&&m<mins(o.iftar))return m<720?o.sahur:o.iftar;
  return t;
}
function dosesFor(k){
  var out=[];
  S.meds.forEach(function(m){if(m.added>k)return;m.times.forEach(function(t){out.push({key:m.id+'@'+t,med:m,time:shiftTime(t),orig:t});});});
  out.sort(function(a,b){return mins(a.time)-mins(b.time)||a.med.name.localeCompare(b.med.name);});
  return out;
}
function entry(k,dose){return (S.log[k]||{})[dose.key];}
function nowMin(){var n=new Date();return n.getHours()*60+n.getMinutes();}
function stateOf(dose,k){
  if(entry(k,dose))return 'taken';
  var d=mins(dose.time)-nowMin();
  if(d>0)return 'upcoming';
  return -d>45?'late':'due';
}
function medLine(m){return esc(m.name)+(m.dose?' '+esc(m.dose):'');}

function head(){

function greeting(){var h=new Date().getHours();return h<5?tr('Қайырлы түн'):h<12?tr('Қайырлы таң'):h<18?tr('Қайырлы күн'):tr('Қайырлы кеш');}

var weekOff=0;
function weekStart(off){var t=new Date();t.setHours(0,0,0,0);return addDays(t,-((t.getDay()+6)%7)+off*7);}
function weekTitle(off){var m=weekStart(off),e=addDays(m,6);return (off===0?tr('Осы апта'):off===-1?tr('Өткен апта'):tr('Апта'))+' · '+dmy(m.getTime())+'–'+dmy(e.getTime());}
function weekHTML(off){
  off=off||0;
  var mon=weekStart(off),tk=dkey(new Date()),cells='';
  for(var i=0;i<7;i++){
    var d=addDays(mon,i),k=dkey(d),ds=dosesFor(k),n=ds.length,t=ds.filter(function(x){return entry(k,x);}).length;
    var isToday=k===tk,fut=k>tk,cls;
    if(fut||n===0)cls='none';else if(t===n)cls='full';else if(isToday)cls=t===0?'wait':'part';else cls=t===0?'miss':'part';
    cells+='<div class="day'+(isToday?' now':'')+'"><small>'+KZ_D[d.getDay()]+'</small><div class="dot '+cls+'">'+(cls==='full'?ic('check',16):d.getDate())+'</div><div class="cnt">'+(n&&!fut?t+'/'+n:'–')+'</div></div>';
  }
  return '<div class="wk">'+cells+tr('</div><div class="legend"><span><i style="background:var(--teal)"></i>бәрі ішілді</span><span><i style="background:var(--teal-tint);box-shadow:inset 0 0 0 2px var(--teal)"></i>бір бөлігі</span><span><i style="background:var(--coral-tint);box-shadow:inset 0 0 0 2px var(--coral)"></i>ұмытылды</span></div>');
}

function doseRow(dose,k,rel){
  var st=stateOf(dose,k),e=entry(k,dose),m=dose.med;
  var meta='<b>'+esc(dose.time)+'</b>'+(m.note?' · '+esc(m.note):'')+(dose.orig!==dose.time?tr(' · әдетте ')+esc(dose.orig):'');
  if(e&&e.at)meta='<b>'+esc(dose.time)+'</b> · '+esc(e.at)+tr(' ішілді')+(e.by==='rel'?tr(' · туыс растады (телефонмен)'):tr(' · өзі белгіледі'));
  var act='';
  if(rel){
    act=st==='taken'?tr('<span class="tag ok">Ішілді</span>'):(st==='late'||st==='due')?'<button class="btn sm'+(st==='late'?' coral':'')+'" data-act="rel-take" data-key="'+esc(dose.key)+'">'+tr('Ішкенін растау')+'</button>':'<span class="tag wait">'+tr('Күтілуде')+'</span>';
  }else if(st==='taken'){
    act='<button class="check on" data-act="untake" data-key="'+esc(dose.key)+tr('" aria-label="Белгіні алып тастау: ')+esc(m.name)+'">'+ic('check',18)+'</button>';
  }else if(st==='due'||st==='late'){
    act='<button class="btn'+(st==='late'?' coral':'')+'" data-act="take" data-key="'+esc(dose.key)+tr('">Іштім</button>');
  }else{
    act='<button class="check" data-act="take" data-key="'+esc(dose.key)+tr('" aria-label="Ішілді деп белгілеу: ')+esc(m.name)+'">'+ic('check',18)+'</button>';
  }
  return '<div class="dose '+st+'"><div class="pill-ic">'+ic('pill',20)+'</div><div class="dose-main"><div class="dose-name">'+medLine(m)+'</div><div class="dose-meta">'+meta+'</div></div>'+act+'</div>';
}

function chartHTML(type){

async function hashPw(salt,pw){
  try{if(window.crypto&&crypto.subtle){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pw));return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');}}catch(e){}
  var h=5381,t=salt+':'+pw;for(var i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))>>>0;return 'x'+h;
}

function askFacts(m){
  var planned=0,taken=0,last='',i,d,k;
  for(i=1;i<=7;i++){d=addDays(new Date(),-i);k=dkey(d);
    dosesFor(k).forEach(function(x){if(x.med.id!==m.id)return;planned++;if(entry(k,x))taken++;});}
  for(i=0;i<=13&&!last;i++){d=addDays(new Date(),-i);k=dkey(d);
    var es=dosesFor(k).filter(function(x){return x.med.id===m.id;}).map(function(x){return entry(k,x);}).filter(function(e){return e&&e.at;});
    if(es.length){var mx=es.reduce(function(a,b){return mins(b.at)>mins(a.at)?b:a;});last=dmy(d.getTime())+' '+mx.at;}
  }
  return {planned:planned,taken:taken,last:last};
}

var prep={q:'',out:'',busy:false,ctl:null,err:''};
function prepFacts(){
  var meds=[],i,d,k,tot={p:0,t:0};
  S.meds.forEach(function(m){
    var p=0,t=0;
    for(i=1;i<=30;i++){d=addDays(new Date(),-i);k=dkey(d);if(m.added>k)continue;m.times.forEach(function(tm){p++;if((S.log[k]||{})[m.id+'@'+tm])t++;});}
    if(p)meds.push({name:m.name+(m.dose?' '+m.dose:''),planned:p,taken:t,missed:p-t});
    tot.p+=p;tot.t+=t;
  });
  var since=Date.now()-30*86400000;
  function vit(type){
    var v=vitalsOf(type).filter(function(x){return x.t>=since;});if(!v.length)return null;
    var l=v[v.length-1];
    function mm(key){var a=v.map(function(x){return +x[key];});return [Math.min.apply(null,a),Math.max.apply(null,a)];}
    return {count:v.length,last:type==='bp'?l.a+'/'+l.b:String(l.a),lastDate:dmy(l.t),a:mm('a'),b:type==='bp'?mm('b'):null};
  }
  return {meds:meds,total:tot,bp:vit('bp'),glu:vit('glu')};
}
function prepTemplate(f){
  var t=tr('Қабылдауға дайындық. ')+(S.name||tr('Пациент'))+', '+dmy(Date.now())+tr('.\n\nДәрілер (соңғы 30 күн):\n');
  if(!f.meds.length)t+=tr('- Қабылдау деректері жоқ.\n');
  f.meds.forEach(function(m){t+='- '+m.name+': '+m.taken+' / '+m.planned+tr(' рет ішілді (')+Math.round(m.taken/m.planned*100)+tr('%), өткізілген ')+m.missed+'.\n';});
  if(f.bp||f.glu){
    t+=tr('\nӨлшемдер (соңғы 30 күн):\n');
    if(f.bp)t+=tr('- Қан қысымы: ')+f.bp.count+tr(' өлшем, соңғысы ')+f.bp.last+' ('+f.bp.lastDate+tr('); жоғарғысы ')+f.bp.a[0]+'–'+f.bp.a[1]+tr(', төменгісі ')+f.bp.b[0]+'–'+f.bp.b[1]+'.\n';
    if(f.glu)t+=tr('- Қант: ')+f.glu.count+tr(' өлшем, соңғысы ')+fmt(f.glu.last,1)+tr(' ммоль/л (')+f.glu.lastDate+'); '+fmt(f.glu.a[0],1)+'–'+fmt(f.glu.a[1],1)+'.\n';
  }

  t+=tr('\nДәрігерге сұрақтарым:\n')+(qs.length?qs.map(function(x){return '- '+x;}).join('\n'):'- ')+'\n';
  return t;
}

async function prepGo(){
  var f=prepFacts(),fb=prepTemplate(f);

}

function cleanTimes(a){
  var out=[];(Array.isArray(a)?a:[]).forEach(function(t){
    var m=/^(\d{1,2}):(\d{2})$/.exec(String(t).trim());
    if(m&&+m[1]<24&&+m[2]<60){var v=pad(+m[1])+':'+m[2];if(out.indexOf(v)<0)out.push(v);}
  });
  return out.sort();
}
async function readPhoto(file){
  if(!file||!sampleFn||!(S.consent&&S.consent.ai))return;
  if(!isPrem()&&(S.scans||0)>=FREE_SCANS)return;
  if(add.preview){try{URL.revokeObjectURL(add.preview);}catch(e){}}
  try{add.preview=URL.createObjectURL(file);}catch(e){add.preview=null;}
  add.phase='reading';add.err='';add.msg='';add.ctl=new AbortController();render();
  try{
    var r=await sampleFn.json(PROMPT,{images:[file],signal:add.ctl.signal});
    var list=(r&&Array.isArray(r.medicines)?r.medicines:[]).map(function(x){
      var name=String((x&&x.name)||'').trim();
      var conf=typeof x.confidence==='number'?Math.max(0,Math.min(1,x.confidence)):0.5;
      var times=cleanTimes(x.times);
      return {name:name,dose:String(x.dose||'').trim(),note:String(x.note||'').trim(),times:times.length?times:['08:00'],conf:conf,include:!!name,manual:false};
    }).filter(function(x){return x.name;});
    if(!r||r.readable===false||!list.length){
      add.phase='idle';add.msg=(r&&r.message)||tr('Фотодан дәрі табылмады. Анығырақ сурет түсіріп көріңіз немесе қолмен қосыңыз.');
    }else{add.items=list;add.phase='review';add.confirmed=false;if(!isPrem()){S.scans=(S.scans||0)+1;save();}}
  }catch(e){
    add.phase='idle';
    if(!e||e.code!=='cancelled')add.err=errCopy(e&&e.code);
  }
  add.ctl=null;
  if(view==='add')render();
}

  else if(a==='save-stock'){
    S.meds.forEach(function(m){
      var n=document.getElementById('stN_'+m.id),p=document.getElementById('stP_'+m.id);if(!n)return;
      var nv=parseFloat(String(n.value).replace(',','.')),pv=parseFloat(String(p.value).replace(',','.'));

    });
    save();render();toast(tr('Қор сақталды'));
  }
  else if(a==='ask-go'){askGo();}
  else if(a==='ask-stop'){if(ask.ctl)ask.ctl.abort();}
  else if(a==='ask-copy'){
    var ta=document.getElementById('askOut'),txt=ta?ta.value:ask.out;
    (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){toast(tr('Көшірілді'));}).catch(function(){if(ta){ta.focus();ta.select();}toast(tr('Мәтін таңдалды, көшіріңіз'));});

  else if(a==='save-settings'){
    var g=function(id){var e=document.getElementById(id);return e?e.value.trim():'';},er=document.getElementById('sErr'),pn2=g('sName'),rn=g('sRelName'),rp=g('sRelPhone'),msg='';
    if(!pn2)msg=tr('Атыңызды жазыңыз.');else if(rn&&!normPhone(rp))msg=tr('Туыстың телефонын толық жазыңыз.');else if(rn&&!g('sRelRel'))msg=tr('Туыс кім екенін таңдаңыз.');

    S.relative=rn?{name:rn,rel:g('sRelRel'),phone:normPhone(rp)}:null;
    save();menu='main';render();toast(tr('Сақталды'));
  }
  else if(a==='go-sub'){menu='sub';subAsk=false;render();}
  else if(a==='sub-ask'){track('subview');subAsk=true;pay={method:'',busy:false};render();}
  else if(a==='sub-cancel'){subAsk=false;pay={method:'',busy:false};render();}
  else if(a==='pay-method'){if(!pay.busy){pay.method=b.dataset.m;render();}}
  else if(a==='sub-pay'){
    if(!pay.method||pay.busy)return;track('paytry');

  }
  else if(a==='sub-off'){S.plan={tier:'free'};save();render();toast(tr('Жазылым тоқтатылды'));}
  else if(a==='rel-add'){menu='settings';render();}
  else if(a==='save-name'){var pn=document.getElementById('pName');S.name=(pn&&pn.value.trim())||S.name||tr('Достым');save();menu='main';render();toast(tr('Сақталды'));}
  else if(a==='oraza-close'){menu='main';render();}
  else if(a==='oraza-off'){S.oraza.on=false;orazaOpen=false;save();render();toast(tr('Ораза режимі өшірілді'));}
  else if(a==='oraza-on'){
    if(!isPrem()){menu='sub';render();return;}
    var sa=document.getElementById('oSahur'),ift=document.getElementById('oIftar');
    if(!sa||!ift||!sa.value||!ift.value||mins(sa.value)>=mins(ift.value)){toast(tr('Сәрі уақыты ауызашардан ерте болуы керек'));return;}
    S.oraza={on:true,sahur:sa.value,iftar:ift.value};menu=null;save();render();toast(tr('Ораза режимі қосылды'));
  }
  else if(a==='sample-rx'){add.items=sampleItems();add.preview=SAMPLE_RX;add.phase='review';add.confirmed=false;add.err='';add.msg='';render();window.scrollTo(0,0);}
  else if(a==='manual'){add.items=[{name:'',dose:'',note:'',times:['08:00'],conf:null,include:true,manual:true}];add.phase='review';add.confirmed=false;add.preview=null;add.err='';add.msg='';render();}
  else if(a==='more'){add.items.push({name:'',dose:'',note:'',times:['08:00'],conf:null,include:true,manual:true});render();}
  else if(a==='cancel-add'){add.phase='idle';add.items=[];add.preview=null;render();}
  else if(a==='rm-time'){var it=add.items[i];it.times=it.times.filter(function(t){return t!==b.dataset.t;});render();}
  else if(a==='add-time'){
    var inp=document.getElementById('tm'+i),v=cleanTimes([inp&&inp.value]);
    if(v.length){var it2=add.items[i];if(it2.times.indexOf(v[0])<0){it2.times.push(v[0]);it2.times.sort();}render();}
    else toast(tr('Уақытты таңдаңыз'));
  }
  else if(a==='save-add'){
    var today=dkey(new Date()),cnt=0;
    add.items.forEach(function(it){
      if(!it.include||!it.name.trim()||!it.times.length)return;
      S.meds.push({id:'u'+uid(),name:it.name.trim(),dose:it.dose.trim(),times:it.times.slice(),note:it.note.trim(),added:today});cnt++;
    });
    if(cnt){save();pilotSync();add.phase='idle';add.items=[];add.preview=null;view='home';render();window.scrollTo(0,0);toast(cnt+tr(' дәрі кестеге қосылды'));}
  }
});

  var f2=t.dataset&&t.dataset.f;

  else if(f2==='confirmed'){add.confirmed=t.checked;render();}
});

/* ---------- own server (Netlify function) for sites outside claude.ai ---------- */
var API_URL='/.netlify/functions/read-rx';
function fileToJpegB64(file){return new Promise(function(res,rej){
  var url=URL.createObjectURL(file),im=new Image();
  im.onload=function(){try{
    var mx=1600,sc=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    c.toBlob(function(b){URL.revokeObjectURL(url);if(!b){rej(new Error('blob'));return;}
      var r=new FileReader();r.onload=function(){res(String(r.result).split(',')[1]);};r.onerror=rej;r.readAsDataURL(b);},'image/jpeg',0.85);
  }catch(e){rej(e);}};
  im.onerror=function(){try{URL.revokeObjectURL(url);}catch(e){}rej(new Error('img'));};
  im.src=url;});}
function serverSample(){
  var f=async function(){throw {code:'images_unavailable'};};
  f.json=async function(prompt,o){
    var sig=o&&o.signal,file=o&&o.images&&o.images[0],b64;
    try{b64=await fileToJpegB64(file);}catch(e){throw {code:'image_rejected'};}
    var r;
    try{r=await fetch(API_URL,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({image:b64,mediaType:'image/jpeg',lang:(typeof LANG!=='undefined'?LANG:'kk')}),signal:sig});}
    catch(e){if(e&&e.name==='AbortError')throw {code:'cancelled'};throw {code:'images_unavailable'};}
    if(r.status===429)throw {code:'rate_limited'};
    if(r.status===400)throw {code:'image_rejected'};
    if(!r.ok)throw {code:'failed'};
    return await r.json();
  };
  f.limits=async function(){return {images:{mediaTypes:['image/*']}};};
  return f;
}

/* ---------- capabilities ---------- */
(async function(){
  try{
    if(window.claude&&window.claude.use){
      var s=await window.claude.use('sample');
      if(s){
        var l=await s.limits().catch(function(){return null;});
        sampleFn=s;imgLimits=l;
      }
    }
  }catch(e){}
  if(!sampleFn&&/^https?:/.test(location.protocol)){
    try{
      var pr=await fetch(API_URL,{method:'GET'});
      var pj=pr.ok?await pr.json():null;
      if(pj&&pj.ok){sampleFn=serverSample();imgLimits=await sampleFn.limits();}
    }catch(e){}
  }
  aiProbed=true;
  if(view==='add'&&add.phase==='idle')render();
})();
})();
