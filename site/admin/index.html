<!doctype html>
<html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>DenSau · Пилот админкасы</title>
<style>
:root{--bg:#f5f7f6;--card:#fff;--ink:#14231f;--mut:#5d6f69;--line:#dfe6e3;--acc:#0f7a64;--acc2:#e8f4f0;--warn:#b4561b}
@media(prefers-color-scheme:dark){:root{--bg:#0e1614;--card:#16211e;--ink:#e8f0ed;--mut:#93a8a1;--line:#263632;--acc:#3fc3a4;--acc2:#183029;--warn:#f0a066}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px max(16px,env(safe-area-inset-left)) 40px}
.w{max-width:1000px;margin:0 auto}h1{font-size:22px;margin:0 0 4px}h2{font-size:16px;margin:28px 0 10px}
.sub{color:var(--mut);margin:0 0 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.login{max-width:360px;margin:12vh auto}input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;margin:8px 0}
button{padding:10px 16px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:600 14px system-ui;cursor:pointer}button.g{background:transparent;color:var(--acc);border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.k{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.k b{display:block;font-size:26px;line-height:1.1}.k span{color:var(--mut);font-size:13px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}table{border-collapse:collapse;width:100%;min-width:560px}th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px;white-space:nowrap}th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}tr:last-child td{border-bottom:0}
.err{color:var(--warn);min-height:20px;font-size:14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}.mut{color:var(--mut);font-size:13px}.fun{display:grid;gap:6px}.fr{display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;font-size:14px}.bar{height:12px;border-radius:6px;background:var(--acc2);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
@media(max-width:520px){.fr{grid-template-columns:110px 1fr 44px}}
</style></head><body><div class="w">
<div id="login" class="card login"><h1>DenSau админкасы</h1><p class="sub">Тек команда үшін</p>
<form id="f"><input id="pw" type="password" placeholder="Құпиясөз" autocomplete="current-password" required><div class="err" id="err"></div><button>Кіру</button></form></div>
<div id="dash" hidden>
<h1>Пилот статистикасы</h1><p class="sub" id="gen"></p>
<div class="row"><button id="rf">Жаңарту</button><button class="g" id="c1">Қатысушылар CSV</button><button class="g" id="c2">Тізім CSV</button><button class="g" id="out">Шығу</button></div>
<h2>Воронка</h2><div class="card fun" id="fun"></div>
<h2>Көрсеткіштер</h2><div class="grid" id="kp"></div>
<h2>Күн бойынша</h2><div class="tw"><table id="days"></table></div>
<h2>Пилот қатысушылары</h2><div class="tw"><table id="pt"></table></div>
<h2>Premium алдын ала тізімі</h2><div class="tw"><table id="wt"></table></div>
<h2>Пікірлер</h2><div class="tw"><table id="ft"></table></div>
<p class="mut">Дәрі аттары жиналмайды. «Кіргендер» — қосымшаны ашқан бірегей құрылғылар (демо көргендер де кіреді).</p>
</div></div>
<script>
var PW='',D=null,T=null;
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function dt(t){if(!t)return '';var d=new Date(t);return d.toLocaleDateString('ru-RU')+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
async function load(){
  var r=await fetch('/.netlify/functions/admin',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:PW})});
  if(r.status===401){throw new Error('Құпиясөз қате')}
  if(r.status===503){throw new Error('Netlify-да ADMIN_PASSWORD әлі қосылмаған')}
  var j=await r.json().catch(function(){return null});
  if(!j||!j.ok){throw new Error('Сервер қатесі. Netlify Blobs қосылғанын тексеріңіз')}
  D=j;render();
}
function tbl(el,head,rows){el.innerHTML='<thead><tr>'+head.map(function(h){return'<th>'+h+'</th>'}).join('')+'</tr></thead><tbody>'+(rows.length?rows.map(function(r){return'<tr>'+r.map(function(c){return'<td>'+esc(c)+'</td>'}).join('')+'</tr>'}).join(''):'<tr><td colspan="'+head.length+'" class="mut">Әзірге бос</td></tr>')+'</tbody>'}
function render(){
  $('login').hidden=true;$('dash').hidden=false;var t=D.totals;
  $('gen').textContent='Жаңартылды: '+dt(D.generated);
  var steps=[['Кіргендер',t.visitors],['Пилот бастады',t.pilotStarted],['Дәріні қолданды (≥1 іштім)',t.pilotActive],['Premium бөлімін ашты',t.subview],['Демо төлем басты',t.paytry],['Premium қажет',t.want],['Тізімге жазылды (телефон)',t.preorder]];
  var mx=Math.max(1,t.visitors);
  $('fun').innerHTML=steps.map(function(s){return'<div class="fr"><span>'+s[0]+'</span><div class="bar"><i style="width:'+Math.round(s[1]/mx*100)+'%"></i></div><b>'+s[1]+'</b></div>'}).join('');
  var k=[['Қабылдау пайызы',t.adherence+'%'],['Жоспарланған доза',t.planned],['Ішілген доза',t.taken],['Туыс растаған',t.rel],['Туыс қосқандар',t.withRelative],['Күнтізбеге қосқандар',t.ics],['Есеп жасағандар',t.report],['Орташа баға (1–5)',t.feedbackAvg||'—']];
  $('kp').innerHTML=k.map(function(x){return'<div class="k"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>'}).join('');
  var days=Object.keys(D.byDay).sort().reverse();
  tbl($('days'),['Күні','Кірген','Пилот бастаған'],days.map(function(d){return[d,D.byDay[d].visitors,D.byDay[d].pilotStarts]}));
  tbl($('pt'),['Код','Басталды','Күн','Жоспар','Ішті','%','Туыс растады','Туыс бар','Premium','Соңғы кіру'],D.pilots.map(function(p){return[p.code,dt(p.start),p.day,p.planned,p.taken,p.planned?Math.round(p.taken/p.planned*100)+'%':'—',p.rel,p.hasRel?'иә':'жоқ',p.preorder?'тізімде':(p.want?'қажет':'—'),dt(p.last)]}));
  tbl($('wt'),['Код','Аты','Телефон','Күні'],D.waitlist.map(function(w){return[w.code,w.name,w.phone,dt(w.ts)]}));
  tbl($('ft'),['Код','Баға','Пікір','Күні'],D.feedback.map(function(f){return[f.code,f.rate||'',f.text,dt(f.ts)]}));
}
function csv(name,head,rows){var s=[head].concat(rows).map(function(r){return r.map(function(c){c=String(c==null?'':c);return /[",\n;]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')}).join('\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+s],{type:'text/csv'}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
$('f').addEventListener('submit',async function(e){e.preventDefault();PW=$('pw').value;$('err').textContent='';try{await load();try{sessionStorage.setItem('dsa',PW)}catch(x){}clearInterval(T);T=setInterval(function(){load().catch(function(){})},30000)}catch(x){$('err').textContent=x.message}});
$('rf').onclick=function(){load().catch(function(x){alert(x.message)})};
$('out').onclick=function(){try{sessionStorage.removeItem('dsa')}catch(x){}location.reload()};
$('c1').onclick=function(){csv('pilot.csv',['code','start','day','planned','taken','rel','meds','hasRelative','want','preorder','ics','last'],D.pilots.map(function(p){return[p.code,new Date(p.start).toISOString(),p.day,p.planned,p.taken,p.rel,p.meds,p.hasRel,p.want,p.preorder,p.ics,new Date(p.last).toISOString()]}))};
$('c2').onclick=function(){csv('waitlist.csv',['code','name','phone','date'],D.waitlist.map(function(w){return[w.code,w.name,w.phone,new Date(w.ts).toISOString()]}))};
try{var sp=sessionStorage.getItem('dsa');if(sp){PW=sp;load().then(function(){clearInterval(T);T=setInterval(function(){load().catch(function(){})},30000)}).catch(function(){})}}catch(x){}
</script></body></html>
